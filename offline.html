<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d97a22">
<title>Offline · Fire Track</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main class="login-body" style="min-height:100vh">
  <div class="login-wrap">
    <div class="login-card" style="text-align:center">
      <div class="login-logo"><img src="assets/icon-192.png" alt="" width="64" height="64" style="border-radius:18px"></div>
      <h1>No internet right now</h1>
      <p class="muted">The live map will come back as soon as your phone has signal again.</p>
      <button class="btn btn-primary btn-lg btn-block" onclick="location.reload()">Try again</button>
    </div>
  </div>
</main>
</body>
</html>
